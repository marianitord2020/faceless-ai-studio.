name: Verificar voz Fola con Google Gemini
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-gemini-fola.yml'
      - 'workers/script-generator.js'
      - 'workers/ideas-generator.js'
      - 'workers/news-search.js'
      - 'workers/news-sources.js'
      - 'workers/wiki-search.js'
      - 'tests/news-topic.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
      APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar tema literal y respaldo HTTP 429
        run: node tests/news-topic.mjs
      - name: Comprobar cobertura nacional y farándula en español
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os,subprocess
          endpoint='https://faceless-images.marianitord2020.workers.dev/ideas'
          for topic,style in [('Noticias de República Dominicana','Noticias'),('Farándula reciente','Farándula')]:
              payload=json.dumps({'topic':topic,'style':style,'mode':'news'}).encode()
              call=subprocess.run(['curl','-sS','--max-time','110','-w','\\n%{http_code}','-X','POST',endpoint,'-H','Origin: https://marianitord2020.github.io','-H','Content-Type: application/json','-H','x-app-token: '+os.environ['APP_PASSCODE'],'--data-binary','@-'],input=payload,capture_output=True,check=True)
              body,code=call.stdout.decode().rsplit(chr(10),1)
              if code!='200':raise RuntimeError('Error de cobertura HTTP '+code+': '+body[:400])
              result=json.loads(body)
              assert result['query']==topic and 1<=len(result['ideas'])<=10
              assert result['matchType'] in ('exact','related')
              coverage=result['sourceCoverage']
              assert coverage['publishers']>=22 and coverage['dominicanPublishers']>=14
              assert len(coverage['queriedPublishers'])<=14
              assert all(i.get('sourceUrl','').startswith('https://') and i.get('matchType') in ('exact','related') for i in result['ideas'])
              print('COBERTURA REAL:',topic,len(result['ideas']),'resultados;',result['sourceProvider'],'catálogo:',coverage['publishers'],'medios')
          PY

      - name: Probar acceso directo seguro a Fola
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GEMINI_TTS_API_KEY" ]; then
            echo "::error::Falta GEMINI_TTS_API_KEY como GitHub Actions secret."
            exit 1
          fi
          cat > "$RUNNER_TEMP/payload.json" <<'JSON'
          {
            "contents": [
              {
                "role": "user",
                "parts": [
                  {
                    "text": "Hola. Esta es una prueba de la voz Fola para Faceless AI Studio.",
                    "speechMetadata": {"style": "Alegre, clara y natural en español latinoamericano"}
                  }
                ]
              }
            ],
            "generationConfig": {
              "responseModalities": ["AUDIO"],
              "speechConfig": {"voiceConfig": {"voice": "Fola"}}
            }
          }
          JSON
          status=$(curl --silent --show-error --max-time 85 \
            --output "$RUNNER_TEMP/fola.json" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: $GEMINI_TTS_API_KEY" \
            --data-binary @"$RUNNER_TEMP/payload.json" \
            'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-lite-tts:generateContent')
          if [ "$status" != "200" ]; then
            echo "::error::Google no aceptó la prueba Fola. HTTP $status"
            python3 - "$RUNNER_TEMP/fola.json" <<'PY'
          import json,sys
          try:
            e=json.load(open(sys.argv[1]))['error']
            print('Google:',e.get('status','ERROR'),str(e.get('message','')).splitlines()[0][:280])
          except Exception: print('Google no devolvió información de error interpretable.')
          PY
            exit 1
          fi
          python3 - "$RUNNER_TEMP/fola.json" <<'PY'
          import json,sys,base64
          d=json.load(open(sys.argv[1]))
          parts=d.get('candidates',[{}])[0].get('content',{}).get('parts',[])
          audio=next((p.get('inlineData') or p.get('inline_data') for p in parts if p.get('inlineData') or p.get('inline_data')),None)
          assert audio and audio.get('data'),'Google no devolvió audio'
          blob=base64.b64decode(audio['data'],validate=True)
          assert blob.startswith(b'RIFF') and len(blob)>1000,'La respuesta no es un archivo WAV válido'
          print('VOZ FOLA REAL VERIFICADA: audio WAV generado, bytes:',len(blob))
          PY
      - name: Verificar Fola desde Cloudflare y la pagina
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_PASSCODE"
          status=$(curl --silent --show-error --max-time 110 \
            --output "$RUNNER_TEMP/worker-fola.json" --write-out '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/voice' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data '{"text":"Hola. Fola ahora narra nuestros videos en español.","voice":"Fola"}')
          if [ "$status" != "200" ]; then
            echo "::error::La ruta Cloudflare de voz falló (HTTP $status)"
            python3 - "$RUNNER_TEMP/worker-fola.json" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get('error','Error sin detalle'))[:280])
          except Exception: print('Sin detalle de error.')
          PY
            exit 1
          fi
          python3 - "$RUNNER_TEMP/worker-fola.json" <<'PY'
          import json,sys,base64
          obj=json.load(open(sys.argv[1]))
          provider=obj.get("provider","")
          print("Proveedor real de voz:",provider)
          if "Gemini TTS" not in provider or "Fola" not in provider:
            print("AVISO: Se usó voz de respaldo, no Fola.",flush=True)
            raise SystemExit(1)
          uri=obj.get("dataURI","")
          assert uri.startswith("data:audio/wav;base64,"),"Google debe devolver WAV"
          audio=base64.b64decode(uri.split(",",1)[1],validate=True)
          assert audio.startswith(b"RIFF") and len(audio)>1000,"WAV inválido"
          print("FOLA ACTIVA EN FACELESS AI STUDIO: WAV válido, bytes",len(audio))
          PY

      - name: Probar diez portadas de ficción con Gemini
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 110 -o "$RUNNER_TEMP/ideas-fiction.json" -w '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/ideas' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data '{"topic":"Historias de amor","style":"Romance","mode":"fiction"}')
          if [ "$code" != "200" ]; then
            echo "::error::Falló la generación de ideas (HTTP $code)"
            python3 - "$RUNNER_TEMP/ideas-fiction.json" <<'PY'
          import json,sys
          try: print(json.load(open(sys.argv[1])).get('error','Error desconocido'))
          except: print('Respuesta incompleta')
          PY
            exit 1
          fi
          python3 - "$RUNNER_TEMP/ideas-fiction.json" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1]))
          ideas=o.get('ideas',[])
          assert len(ideas)==10,'Esperaba exactamente diez portadas'
          assert len(set(i['title'] for i in ideas))==10,'Títulos duplicados'
          assert all(i.get('synopsis') and i.get('outline') for i in ideas),'Falta narrativa de una portada'
          print('DIEZ PORTADAS IA VERIFICADAS. Ejemplo:',ideas[1]['title'])
          PY
      - name: Probar noticias con fuentes o rechazo explícito
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 110 -o "$RUNNER_TEMP/ideas-news.json" -w '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/ideas' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data '{"topic":"Noticias de Higüey hoy","style":"Noticias","mode":"news"}')
          if [ "$code" = "200" ]; then
            python3 - "$RUNNER_TEMP/ideas-news.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          news=data.get('ideas',[])
          assert news and len(news)<=10,'Número de noticias inválido'
          assert all(x.get('sourceUrl','').startswith('https://') for x in news),'Noticia sin fuente real'
          print('NOTICIAS CON FUENTES: ',len(news),'Ejemplo:',news[0]['title'])
          PY
          elif [ "$code" = "503" ]; then
            python3 - "$RUNNER_TEMP/ideas-news.json" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1])).get('error','')
          assert 'límite' in e.lower() or 'temporalmente' in e.lower(),'Error 503 no describe problema de proveedor'
          print('GDELT LIMITADO TEMPORALMENTE: se informa al usuario en vez de inventar noticias.')
          PY
          elif [ "$code" = "422" ]; then
            python3 - "$RUNNER_TEMP/ideas-news.json" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1])).get('error','')
          assert e and any(x in e.lower() for x in ('fuente','noticia','verific','comproba')),'Error no explica carencia de fuentes'
          print('SIN FUENTES: el servidor rechazó inventar noticias correctamente:',e[:160])
          PY
          else
            echo "::error::Error inesperado en noticias (HTTP $code)"
            python3 - "$RUNNER_TEMP/ideas-news.json" <<'PY'
          import json,sys
          try:print(json.load(open(sys.argv[1])).get('error','Sin detalle'))
          except:print('Sin detalle')
          PY
            exit 1
          fi

      - name: Probar que portada elegida conserva el relato
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ideas-fiction.json" "$RUNNER_TEMP/script-input.json" <<'PY'
          import json,sys
          ideas=json.load(open(sys.argv[1]))['ideas']
          selected=ideas[1]
          with open(sys.argv[2],'w') as f:
            json.dump({'topic':'Historias de amor','style':'Romance','mode':'ficcion',
              'duration':30,'platform':'TikTok',
              'idea':{'title':selected['title'],'synopsis':selected['synopsis'],
                'outline':selected.get('outline','')}},f,ensure_ascii=False)
          print('TÍTULO SELECCIONADO:',selected['title'])
          PY
          status=$(curl -sS --max-time 110 -o "$RUNNER_TEMP/script-output.json" -w '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/script' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data-binary @"$RUNNER_TEMP/script-input.json")
          if [ "$status" != "200" ]; then
            echo "::error::Guion elegido falló con HTTP $status"
            python3 - "$RUNNER_TEMP/script-output.json" <<'PY'
          import json,sys
          try:print(json.load(open(sys.argv[1])).get('error','Error'))
          except:print('Sin detalles')
          PY
            exit 1
          fi
          python3 - "$RUNNER_TEMP/script-input.json" "$RUNNER_TEMP/script-output.json" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1]))
          output=json.load(open(sys.argv[2]))
          assert request['idea']['title']==output['title'],'Se cambió el título de la portada'
          assert len(output['scenes'])==5,'Número de escenas incorrecto'
          assert output['mode']=='ficcion','Se cambió el modo del relato'
          assert all(sc.get('text') and sc.get('prompt') for sc in output['scenes']),'Escena incompleta'
          print('PORTADA ELEGIDA -> GUIÓN REAL VINCULADO: VERIFICADO')
          print('Título:',output['title'])
          print('Escena 1:',output['scenes'][0]['text'][:180])
          PY

      - name: Comprobar Wikipedia real y documental seleccionado
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 110 -o "$RUNNER_TEMP/wiki-ideas.json" -w '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/ideas' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data '{"topic":"Napoleón Bonaparte","style":"Historia","mode":"factual"}')
          if [ "$code" != "200" ]; then
            python3 - "$RUNNER_TEMP/wiki-ideas.json" <<'PY'
          import json,sys
          try:print(json.load(open(sys.argv[1])).get('error','Sin detalle'))
          except:print('Respuesta incompleta')
          PY
            echo "::error::La búsqueda documental real falló: HTTP $code"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/wiki-ideas.json" "$RUNNER_TEMP/wiki-script-input.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]));ideas=data.get('ideas',[])
          assert ideas and data['query']=='Napoleón Bonaparte'
          assert all(i.get('sourceUrl','').startswith('https://es.wikipedia.org/wiki/') and i.get('synopsis') for i in ideas)
          idea=ideas[0]
          with open(sys.argv[2],'w') as f:json.dump({'topic':'Napoleón Bonaparte','duration':30,'platform':'TikTok','style':'Historia','mode':'informativo','idea':idea},f)
          print('WIKIPEDIA REAL: OK. Propuestas:',len(ideas),'Título:',idea['title'])
          PY
          code=$(curl -sS --max-time 110 -o "$RUNNER_TEMP/wiki-script.json" -w '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/script' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data-binary @"$RUNNER_TEMP/wiki-script-input.json")
          if [ "$code" != "200" ]; then
            python3 - "$RUNNER_TEMP/wiki-script.json" <<'PY'
          import json,sys
          try:print(json.load(open(sys.argv[1])).get('error','Sin detalle'))
          except:print('Respuesta incompleta')
          PY
            echo "::error::El documental seleccionado falló: HTTP $code"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/wiki-script-input.json" "$RUNNER_TEMP/wiki-script.json" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1]));result=json.load(open(sys.argv[2]))
          assert result['title']==request['idea']['title']
          assert len(result['scenes'])==5 and result['mode']=='informativo'
          assert result.get('sources') and result['sources'][0]['url']==request['idea']['sourceUrl']
          print('DOCUMENTAL ELEGIDO: guion real con cinco escenas y fuente conservada: OK')
          print('Primera escena:',result['scenes'][0]['text'])
          PY


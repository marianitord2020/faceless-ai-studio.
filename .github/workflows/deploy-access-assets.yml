name: Sincronizar web protegida en Cloudflare D1
on:
  pull_request:
    paths:
      - "tools/prepare-access-assets.mjs"
      - ".github/workflows/deploy-access-assets.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "styles/**"
      - "scripts/**"
      - "editar-sin-ia/**"
      - "tools/prepare-access-assets.mjs"
      - ".github/workflows/deploy-access-assets.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faceless-access-static-assets
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recuperar la versión actual del Worker y preparar solamente archivos públicos
        run: node tools/prepare-access-assets.mjs
      - name: Comprobar el paquete sin cambiar Cloudflare
        run: npx --yes wrangler@4 deploy --keep-vars --dry-run --config .access-build/wrangler.json --outdir .access-build/dist
      - name: Actualizar assets del Worker D1 conservando código, SQL y servicio MEDIA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx --yes wrangler@4 deploy --keep-vars --config .access-build/wrangler.json
      - name: Confirmar que la página de login sigue protegida
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          host='https://faceless-access-prueba.marianitord2020.workers.dev'
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$host/login")
          deny=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 \
            -X POST "$host/api/ideas" -H "Origin: $host" -H 'Content-Type: application/json' \
            --data '{"topic":"test"}')
          echo "LOGIN_HTTP=$code UNAUTHENTICATED_API_HTTP=$deny"
          test "$code" = 200
          test "$deny" = 401

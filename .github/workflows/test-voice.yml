name: Probar voz IA real en español
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-voice.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
    steps:
      - name: Generar prueba real con Aura-2 español
        run: |
          set -euo pipefail
          test -n "$APP_PASSCODE"
          status=$(curl -sS --max-time 100 -o "$RUNNER_TEMP/voice.json" -w '%{http_code}' \
            -X POST 'https://faceless-images.marianitord2020.workers.dev/voice' \
            -H 'Origin: https://marianitord2020.github.io' \
            -H 'Content-Type: application/json' \
            -H "x-app-token: $APP_PASSCODE" \
            --data '{"text":"Hola, bienvenidos a Faceless AI Studio. Ya tenemos voz en español.","voice":"female"}')
          if [ "$status" != "200" ]; then
            echo "::error::Falló generación de voz HTTP $status"
            jq -r '.error // "Error sin detalles"' "$RUNNER_TEMP/voice.json" | head -c 500
            exit 1
          fi
          python3 - "$RUNNER_TEMP/voice.json" <<'PY'
          import json,sys,base64
          data=json.load(open(sys.argv[1]))
          assert data.get("dataURI","").startswith("data:audio/"),"Sin audio"
          b=base64.b64decode(data["dataURI"].split(",",1)[1],validate=True)
          assert len(b)>1000,"Audio demasiado pequeño"
          assert b[:3]==b"ID3" or b[:2] in (b"\xff\xfb",b"\xff\xf3",b"\xff\xf2"),"No se reconoció MP3"
          print("VOZ REAL GENERADA Y VERIFICADA")
          print("Proveedor:",data.get("provider"))
          print("Bytes:",len(b))
          PY

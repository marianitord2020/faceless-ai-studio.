name: Probar video con voz integrada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/editor-layout.js'
      - 'styles/editor.css'
      - 'scripts/ai-voice.js'
      - 'scripts/cinematic-video.js'
      - 'scripts/media-timing.js'
      - 'scripts/ai-photos.js'
      - 'scripts/discover.js'
      - '.github/workflows/test-video-audio.yml'

permissions:
  contents: read

jobs:
  video-with-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Servir interfaz local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 2
      - name: Exportar video con pista de audio real
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage({acceptDownloads:true});
            page.on('pageerror',e=>console.error('JS PAGE ERROR',e.message));
            const reveal=async selector=>{await page.locator(selector).evaluate(el=>{for(let parent=el.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;});await page.waitForTimeout(30);};
            await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.facelessStudioReady===true,{timeout:15000});
            // Supply deterministic word timings for the test audio, which is a tone.
            await page.evaluate(()=>{
              window.facelessRecognizeLocal=async buffer=>{
                const words=current().scenes.flatMap(scene=>scene.text.trim().split(/\s+/));
                const step=buffer.duration/words.length;
                return words.map((text,index)=>({word:text,start:index*step,end:(index+1)*step}));
              };
            });
            const setup=await page.evaluate(()=>{
              const proj={
                id:'ci-audio',topic:'Video con voz integrada',title:'Prueba de audio',
                platform:'TikTok',duration:4,format:'9:16',style:'Curiosidades',exportFormat:'webm',exportHeight:720,
                date:new Date().toISOString(),narration:'Narración de prueba',
                hook:'Narración de prueba',
                scenes:[{time:0,duration:4,text:'Narración de prueba',prompt:'Prueba visual'}]
              };
              projects.unshift(proj);
              activeId=proj.id;tab='video';
              route('editor');
              const hz=24000,frames=hz*4,buffer=new ArrayBuffer(44+frames*2),d=new DataView(buffer);
              const word=(o,v)=>{for(let j=0;j<v.length;j++)d.setUint8(o+j,v.charCodeAt(j))};
              word(0,'RIFF');d.setUint32(4,buffer.byteLength-8,true);
              word(8,'WAVE');word(12,'fmt ');d.setUint32(16,16,true);
              d.setUint16(20,1,true);d.setUint16(22,1,true);
              d.setUint32(24,hz,true);d.setUint32(28,hz*2,true);
              d.setUint16(32,2,true);d.setUint16(34,16,true);
              word(36,'data');d.setUint32(40,frames*2,true);
              for(let i=0;i<frames;i++)d.setInt16(44+2*i,Math.round(Math.sin(2*Math.PI*440*i/hz)*12000),true);
              audioFile=new File([buffer],'faceless-voz-ci-audio.wav',{type:'audio/wav'});
              audioFileProjectId=proj.id;
              generatedVoiceByProject.set(proj.id,audioFile);
              updateAudioAttachmentUI();
              return {button:document.getElementById('renderVideo').textContent,
                 supportsVideo:typeof HTMLCanvasElement.prototype.captureStream==='function',
                 hasAudio:!!audioFile};
            });
            console.log('SETUP:',setup);
            if(setup.button!=='Crear y descargar video'||!setup.hasAudio)throw Error('La voz no está integrada en el botón');
            await page.locator('#renderVideo').click();
            const progress=page.locator('dialog.video-progress');
            await progress.getByLabel('Código privado').waitFor({state:'visible'});
            await progress.getByRole('button',{name:'Cerrar',exact:true}).click();
            await progress.waitFor({state:'detached'});
            const voiceChange=await page.evaluate(()=>{
              const old=audioFile;
              const area=document.getElementById('aiVoiceAudioArea');
              const oldPlayer=document.createElement('audio');
              oldPlayer.src='data:audio/wav;base64,UklGRg==';
              area.appendChild(oldPlayer);
              const selector=document.getElementById('aiVoiceOption');
              selector.value='Kore';
              selector.dispatchEvent(new Event('change'));
              const ok=!audioFile && !generatedVoiceByProject.has('ci-audio') &&
                !area.querySelector('audio') && !oldPlayer.src;
              audioFile=old;
              audioFileProjectId='ci-audio';
              generatedVoiceByProject.set('ci-audio',old);
              updateAudioAttachmentUI();
              return {ok,button:document.getElementById('renderVideo').textContent};
            });
            console.log('CAMBIO DE VOZ:',voiceChange);
            if(!voiceChange.ok||voiceChange.button!=='Crear y descargar video')throw Error('La voz anterior no se reemplazó correctamente');
            const exported=await page.evaluate(()=>renderVideo());
            if(!exported)throw Error(await page.locator('#renderStatus').textContent());
            const result=await page.evaluate(()=>({
              status:document.getElementById('renderStatus')?.textContent,
              videoUrl:previewURL,
              filename:document.querySelector('#downloadArea a')?.download
            }));
            console.log('EXPORT STATUS:',result.status);
            if(!result.videoUrl || !result.filename || !result.filename.includes('.webm'))throw Error('No se creó el video con voz');
            const downloadPromise=page.waitForEvent('download');
            await page.locator('#downloadArea a').click();
            const download=await downloadPromise;
            await download.saveAs('/tmp/faceless-audio-video.webm');
            const bytes=fs.statSync('/tmp/faceless-audio-video.webm').size;
            if(bytes<10000)throw Error('Video demasiado pequeño: '+bytes);
            console.log('VIDEO OK; bytes:',bytes);
            // Exercise the complete pipeline with deterministic media, without consuming API quota.
            let imageCalls=0,voiceCalls=0,failSecondPhoto=true,failSecondVoice=true,fixtureImage;
            await page.route('**/faceless-images.marianitord2020.workers.dev/images',async route=>{
              imageCalls++;
              if(imageCalls===2&&failSecondPhoto){
                await route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({error:'Proveedor temporalmente no disponible'})});return;
              }
              const png=fixtureImage;
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({provider:'CI fixture',dataURI:png})});
            });
            fixtureImage=await page.evaluate(()=>{const c=document.createElement('canvas');c.width=32;c.height=32;c.getContext('2d').fillRect(0,0,32,32);return c.toDataURL('image/png')});
            const fixture=await page.evaluate(async()=>{
              const context=new OfflineAudioContext(1,24000,24000),osc=context.createOscillator();
              osc.connect(context.destination);osc.start();osc.stop(0.8);
              const wav=facelessAudioToWAV(await context.startRendering());
              return await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(wav)});
            });
            await page.route('**/faceless-images.marianitord2020.workers.dev/voice',async route=>{
              voiceCalls++;
              if(voiceCalls===2&&failSecondVoice){
                await route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({error:'Voz temporalmente no disponible'})});return;
              }
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({provider:'CI fixture',dataURI:fixture})});
            });
            await page.evaluate(()=>{
              const p={id:'ci-complete',topic:'Una historia de prueba',title:'Producción reanudable',
                platform:'TikTok',duration:4,format:'9:16',style:'Romance',date:new Date().toISOString(),
                imageStyle:'cinematic',voicePreset:'female',narration:'Uno. Dos.',exportFormat:'webm',exportHeight:720,
                scenes:[{time:0,duration:2,text:'Uno.',prompt:'A red handbag in a street'},
                  {time:2,duration:2,text:'Dos.',prompt:'The same red handbag at home'}]};
              projects.unshift(p);persist();activeId=p.id;tab='video';resetMedia();route('editor');
            });
            await reveal('#productionPass');
            await page.locator('#productionPass').fill('ci-fixture-passcode-only');
            await page.locator('#productionStart').click();
            await page.waitForFunction(()=>!window.facelessProductionBusy && document.getElementById('productionStatus').textContent.includes('reutilizarán'));
            const retained=await page.evaluate(()=>facelessProjectPhotos('ci-complete').size);
            if(retained!==1||imageCalls!==2||voiceCalls!==0)throw Error('La recuperación tras fallo de foto no conserva el progreso');
            failSecondPhoto=false;
            await page.locator('#productionStart').click();
            await page.waitForFunction(()=>!window.facelessProductionBusy && document.getElementById('productionStatus').textContent.includes('reutilizarán'));
            if(imageCalls!==3||voiceCalls!==2)throw Error('La voz no se detuvo en la segunda escena');
            failSecondVoice=false;
            await page.locator('#productionStart').click();
            await page.waitForFunction(()=>!window.facelessProductionBusy && document.getElementById('productionStatus').textContent.includes('Video completo listo'),null,{timeout:30000});
            if(imageCalls!==3||voiceCalls!==3)throw Error('Se repitieron medios terminados al retomar');
            if(!await page.locator('#downloadArea a').isVisible())throw Error('Falta descarga del video completo');
            const completeDownloadPromise=page.waitForEvent('download');
            await page.locator('#downloadArea a').click();
            await (await completeDownloadPromise).saveAs('/tmp/faceless-complete-video.webm');
            await page.reload();
            await page.waitForFunction(()=>window.facelessStudioReady===true);
            await page.evaluate(()=>{activeId='ci-complete';tab='video';route('editor')});
            await page.waitForFunction(()=>facelessProjectPhotos('ci-complete').size===2 && audioFile?.size>1000);
            await reveal('#aiVoiceAudioArea audio');
            await page.locator('#aiVoiceAudioArea audio').waitFor({state:'visible'});
            if(!await page.locator('#aiVoiceAudioArea a').isVisible())throw Error('La voz recuperada no tiene descarga');
            const privateLeak=await page.evaluate(async()=>{
              if(JSON.stringify(localStorage).includes('ci-fixture-passcode-only'))return true;
              const db=await facelessOpenMedia();
              const entries=await new Promise(resolve=>{const r=db.transaction('media').objectStore('media').getAll();r.onsuccess=()=>resolve(r.result)});
              return JSON.stringify(entries).includes('ci-fixture-passcode-only');
            });
            if(privateLeak)throw Error('Se guardó el código privado');
            await reveal('#productionPass');
            await page.locator('#productionPass').fill('ci-fixture-passcode-only');
            await page.locator('#productionStart').click();
            await page.waitForFunction(()=>document.getElementById('productionStatus').textContent.includes('4 de 4'));
            await page.locator('#productionStop').click();
            await page.waitForFunction(()=>!window.facelessProductionBusy);
            if(imageCalls!==3||voiceCalls!==3)throw Error('Recargar provocó nuevas llamadas a la IA');
            if(!await page.locator('#productionStart').isEnabled())throw Error('El botón quedó bloqueado tras detener');
            await reveal('#aiVoiceOption');
            await page.locator('#aiVoiceOption').selectOption('male');
            await page.waitForFunction(()=>!audioFile);
            await page.reload();
            await page.waitForFunction(()=>window.facelessStudioReady===true);
            await page.evaluate(async()=>{activeId='ci-complete';tab='video';route('editor');await facelessRestoreMedia(current())});
            if(await page.evaluate(()=>Boolean(audioFile)))throw Error('Se restauró una voz invalidada al cambiarla');
            await page.evaluate(async()=>{
              current().imageStyle='anime';persist();await facelessRestoreMedia(current());
              if(facelessProjectPhotos(current().id).size)throw Error('Se reutilizaron imágenes de otro estilo');
            });
            console.log('PRODUCCIÓN COMPLETA: fallo y reanudación, video con voz, recarga sin llamadas IA, cancelación, invalidación y privacidad: OK');
            const longVoice=await page.evaluate(async()=>{
              const ctx=new OfflineAudioContext(1,72000,24000),osc=ctx.createOscillator();
              osc.connect(ctx.destination);osc.start(2.4);osc.stop(2.9);
              const wav=facelessAudioToWAV(await ctx.startRendering());
              return new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(wav)});
            });
            await page.unroute('**/faceless-images.marianitord2020.workers.dev/voice');
            let releaseVoice,voiceReady;
            const voiceStarted=new Promise(resolve=>voiceReady=resolve);
            let voiceTimer;
            await page.route('**/faceless-images.marianitord2020.workers.dev/voice',async route=>{
              await new Promise(resolve=>{releaseVoice=resolve;voiceReady()});
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({provider:'CI long fixture',dataURI:longVoice})});
            });
            await page.evaluate(()=>{
              const p={id:'ci-fit',topic:'Prueba de voz completa',title:'Voz completa',style:'Romance',
                duration:1,format:'9:16',voicePreset:'female',platform:'TikTok',narration:'Texto completo.',
                date:new Date().toISOString(),scenes:[{time:0,duration:1,text:'Texto completo.',prompt:'A red handbag'}]};
              projects.unshift(p);activeId=p.id;tab='video';resetMedia();route('editor');
            });
            await reveal('#productionPass');
            await page.locator('#productionPass').fill('ci-fixture-passcode-only');
            await page.locator('#aiVoiceGenerate').click();
            await Promise.race([voiceStarted,new Promise((_,reject)=>{
              voiceTimer=setTimeout(async()=>{
                console.log('VOICE DIAGNOSTIC',await page.evaluate(()=>({busy:facelessVoiceBusy,status:document.getElementById('aiVoiceStatus')?.textContent,project:current()?.id,button:document.getElementById('aiVoiceGenerate')?.disabled})));
                reject(new Error('La prueba no inició la petición de voz en 15 segundos'));
              },15000);
            })]);clearTimeout(voiceTimer);
            await page.locator('[data-route="projects"]').first().click();
            await page.locator('[data-tab="scenes"]').click();
            if(await page.evaluate(()=>document.querySelector('.screen:not(.hidden)').id!=='editor'||tab!=='video'))
              throw Error('La navegación interrumpió una generación de voz activa');
            releaseVoice();
            await page.waitForFunction(()=>!facelessVoiceBusy&&audioFileProjectId==='ci-fit'&&audioFile?.size>1000);
            const tail=await page.evaluate(async()=>{
              const ctx=new AudioContext(),audio=await ctx.decodeAudioData(await audioFile.arrayBuffer());
              const samples=audio.getChannelData(0);let peak=0;
              for(let i=Math.floor(audio.sampleRate*0.8);i<samples.length;i++)peak=Math.max(peak,Math.abs(samples[i]));
              await ctx.close();return peak;
            });
            if(tail<0.1)throw Error('Se cortó el final de la narración larga');
            console.log('VOZ: reproductor recuperado, navegación protegida y final de narración sin cortes: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          echo "Pistas del video:"
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 /tmp/faceless-audio-video.webm | tee /tmp/faceless-tracks.txt
          grep -q 'audio' /tmp/faceless-tracks.txt
          grep -q 'video' /tmp/faceless-tracks.txt
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/faceless-complete-video.webm | tee /tmp/faceless-complete-tracks.txt
          grep -q audio /tmp/faceless-complete-tracks.txt
          grep -q video /tmp/faceless-complete-tracks.txt
          echo "Audio real integrado: VERIFICADO"
          ffmpeg -i /tmp/faceless-audio-video.webm -vn -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume'


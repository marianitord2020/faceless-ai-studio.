name: Verificar fotos individuales y sincronización de audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/editor-layout.js'
      - 'styles/editor.css'
      - 'scripts/media-*.js'
      - 'scripts/cinematic-video.js'
      - 'tests/cinematic-video.cjs'
      - 'scripts/ai-photos.js'
      - 'scripts/ai-voice.js'
      - 'workers/ai-images-worker.js'
      - 'tests/media-timing.mjs'
      - 'tests/transcribe-route.mjs'
      - '.github/workflows/test-media-editor.yml'
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar alineación y protección del reconocimiento
        run: |
          node tests/cinematic-video.cjs
          node tests/media-timing.mjs
          node tests/transcribe-route.mjs
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/media-http.log 2>&1 &
      - name: Verificar cargas, eliminación, persistencia y subtítulos
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          function wav(seconds){const b=Buffer.alloc(44+seconds*32000);b.write('RIFF');b.writeUInt32LE(b.length-8,4);b.write('WAVE',8);b.write('fmt ',12);b.writeUInt32LE(16,16);b.writeUInt16LE(1,20);b.writeUInt16LE(1,22);b.writeUInt32LE(16000,24);b.writeUInt32LE(32000,28);b.writeUInt16LE(2,32);b.writeUInt16LE(16,34);b.write('data',36);b.writeUInt32LE(seconds*32000,40);return b}
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const reveal=async selector=>{await page.locator(selector).evaluate(el=>{for(let parent=el.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;});await page.waitForTimeout(30);};
            await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.facelessStudioReady);
            await page.evaluate(()=>{const p={id:'media-fixture',title:'Fotos y voz',topic:'Lola',style:'Misterio',duration:12,platform:'TikTok',format:'9:16',date:new Date().toISOString(),scenes:[{time:0,duration:4,text:'Hola esta es la primera escena.',prompt:'Scene one'},{time:4,duration:4,text:'Ahora contamos una historia sobre Lola.',prompt:'Scene two'},{time:8,duration:4,text:'Al final todos regresan a casa.',prompt:'Scene three'}]};p.narration=p.scenes.map(s=>s.text).join('\n');projects.unshift(p);persist();activeId=p.id;tab='video';route('editor')});
            for(const width of [320,360,390,412,768]){
              await page.setViewportSize({width,height:844});
              const bounds=await page.evaluate(()=>{
                const box=id=>{const r=document.getElementById(id).getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
                return {actions:['toggleEdit','copyAll','exportJson','saveProject'].map(box),preview:box('previewVideo'),render:box('renderVideo'),bar:document.querySelector('.editor-export-bar').getBoundingClientRect().bottom,width:innerWidth,height:innerHeight,scroll:document.documentElement.scrollWidth};
              });
              for(let i=0;i<bounds.actions.length;i++)for(let j=i+1;j<bounds.actions.length;j++){
                const a=bounds.actions[i],b=bounds.actions[j];assert.ok(a.right<=b.left+.5||b.right<=a.left+.5||a.bottom<=b.top+.5||b.bottom<=a.top+.5,'Project actions overlap at '+width);
              }
              assert.ok(bounds.actions.every(a=>a.left>=0&&a.right<=width));
              assert.equal(bounds.actions[3].width,36);assert.equal(bounds.actions[3].height,36);
              assert.ok(bounds.preview.bottom+7<=bounds.render.top,'Export rows overlap at '+width);
              assert.ok(Math.abs(bounds.bar-bounds.height)<1);assert.ok(bounds.scroll<=width);
            }
            await page.setViewportSize({width:390,height:844});
            const previewBox=await page.locator('#previewVideo').boundingBox();
            await page.locator('#previewVideo').click();
            await page.waitForFunction(()=>document.getElementById('previewVideo').textContent==='Detener vista previa');
            const activeBox=await page.locator('#previewVideo').boundingBox();assert.equal(activeBox.y,previewBox.y);assert.equal(activeBox.height,previewBox.height);
            await page.locator('#previewVideo').click();assert.equal(await page.locator('#previewVideo').textContent(),'Vista previa');
            await page.evaluate(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'}));
            const lastCard=await page.locator('#videoVoiceCard').boundingBox(),barBox=await page.locator('.editor-export-bar').boundingBox();assert.ok(lastCard.y+lastCard.height<=barBox.y,'Toolbar covers the last card');
            await page.evaluate(()=>{renderTab();window.scrollTo({top:0,behavior:'instant'})});
            assert.equal(await page.locator('.editor-video-card').count(),3);
            assert.deepEqual(await page.locator('.editor-video-card h3').allTextContents(),['Video automático sin créditos','Fotografías automáticas con IA','Narración automática en español']);
            assert.equal(await page.locator('.editor-personalize[open]').count(),0);
            assert.equal(await page.locator('#productionPass').isVisible(),false);
            assert.equal(await page.locator('#aiVoiceOption').isVisible(),false);
            assert.equal(await page.locator('#renderVideo').isVisible(),true);
            await page.locator('#videoPhotosCard summary').first().click();
            await page.locator('#videoVoiceCard summary').first().click();
            await page.waitForTimeout(50);
            assert.equal(await page.locator('.editor-personalize[open]').count(),1);
            await page.locator('#videoVoiceCard summary').first().click();
            const geometry=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth,cards:document.querySelector('.editor-video-cards').getBoundingClientRect().height}));
            assert.ok(geometry.scroll<=geometry.width);assert.ok(geometry.cards<700);
            assert.equal(await page.locator('#manualPhotoSlots').isVisible(),false);assert.equal(await page.locator('#audioAttachment').isVisible(),false);
            const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a6d8AAAAASUVORK5CYII=','base64');
            const photo=name=>({name,mimeType:'image/png',buffer:png});
            await reveal('#pickOwnPhotos');
            const photoChooserPromise=page.waitForEvent('filechooser');await page.locator('#pickOwnPhotos').click();const photoChooser=await photoChooserPromise;assert.equal(photoChooser.isMultiple(),true);await photoChooser.setFiles([photo('primera.png'),photo('segunda.png')]);
            await page.waitForFunction(()=>!window.facelessMediaBusy&&facelessProjectPhotos('media-fixture').size===2);
            assert.equal(await page.locator('#manualPhotoSlots .media-photo-slot img').count(),2);
            await reveal('#pickOwnPhotos');
            await page.getByRole('button',{name:'Quitar foto de escena 1',exact:true}).click();
            await page.waitForFunction(()=>!window.facelessMediaBusy&&!facelessProjectPhotos('media-fixture').has(0));
            assert.equal(await page.evaluate(()=>facelessProjectPhotos('media-fixture').has(1)),true);
            assert.equal(await page.locator('#manualPhotoSlots .media-photo-slot').count(),1);
            await page.locator('#images').setInputFiles(photo('nueva.png'));
            await page.waitForFunction(()=>!window.facelessMediaBusy&&facelessProjectPhotos('media-fixture').has(0));
            await page.locator('.media-photo-slot[data-scene="1"] input').setInputFiles(photo('reemplazo.png'));
            await page.waitForFunction(()=>!window.facelessMediaBusy&&facelessProjectPhotos('media-fixture').get(1)?.facelessFilename==='reemplazo.png');
            await page.reload();await page.waitForFunction(()=>window.facelessStudioReady);
            await page.evaluate(()=>{activeId='media-fixture';tab='video';route('editor')});
            await page.waitForFunction(()=>facelessProjectPhotos('media-fixture').size===2);
            assert.equal(await page.evaluate(()=>facelessProjectPhotos('media-fixture').get(0).facelessFilename),'nueva.png');
            let mismatch=false,transcriptions=0;
            await page.exposeFunction('fixtureRecognize',()=>{
              transcriptions++;
              const groups=['Hola esta es la primera escena','Ahora contamos una historia sobre Lola','Al final todos regresan a casa'];
              return mismatch?[{word:'Completamente',start:1,end:2},{word:'distinto',start:3,end:4}]:groups.flatMap((s,i)=>s.split(' ').map((word,j)=>({word,start:[.5,3,5][i]+j*.2,end:[.5,3,5][i]+j*.2+.15})));
            });
            await page.addInitScript(()=>addEventListener('DOMContentLoaded',()=>{window.facelessRecognizeLocal=()=>window.fixtureRecognize();}));
            await page.evaluate(()=>{window.facelessRecognizeLocal=()=>window.fixtureRecognize();});
            await reveal('#productionPass');
            await page.locator('#productionPass').fill('fixture-media-passcode-only');
            await reveal('#pickOwnAudio');
            const audioChooserPromise=page.waitForEvent('filechooser');await page.locator('#pickOwnAudio').click();const audioChooser=await audioChooserPromise;assert.equal(audioChooser.isMultiple(),false);await audioChooser.setFiles({name:'narracion.wav',mimeType:'audio/wav',buffer:wav(8)});
            await page.waitForFunction(()=>!window.facelessMediaBusy&&current().audioAlignment?.method==='speech');
            const aligned=await page.evaluate(()=>({duration:current().duration,times:current().scenes.map(s=>s.time),text:current().narration,captions:FacelessTiming.cues(current()).map(c=>c.text).join(' '),caption:facelessCaptionAt(current(),3.1)}));
            assert.equal(aligned.duration,8);assert.deepEqual(aligned.times,[0,3,5]);assert.equal(aligned.captions,aligned.text.replaceAll('\n',' '));assert.equal(aligned.caption,'Ahora contamos una historia sobre Lola.');assert.equal(transcriptions,1);
            await page.reload();await page.waitForFunction(()=>window.facelessStudioReady);await page.evaluate(()=>{activeId='media-fixture';tab='video';route('editor')});
            await page.waitForFunction(()=>audioFile?.facelessManual&&current().audioAlignment?.method==='speech');
            await reveal('#uploadedAudioPlayer');
            assert.equal(await page.locator('#uploadedAudioPlayer').isVisible(),true);
            await reveal('#productionPass');
            mismatch=true;await page.locator('#productionPass').fill('fixture-media-passcode-only');
            await page.locator('#audio').setInputFiles({name:'otro.wav',mimeType:'audio/wav',buffer:wav(9)});
            await page.waitForFunction(()=>!window.facelessMediaBusy&&document.getElementById('audioSyncStatus').textContent.includes('no coincide'));
            assert.equal(await page.evaluate(()=>current().audioAlignment.method),'estimated');assert.equal(await page.evaluate(()=>current().duration),9);
            await reveal('#pickOwnAudio');
            await page.getByRole('button',{name:'Quitar audio',exact:true}).click();
            await page.waitForFunction(()=>!window.facelessMediaBusy&&!audioFile);
            assert.equal(await page.evaluate(()=>current().duration),12);assert.equal(await page.locator('#audioAttachment').isVisible(),false);
            await reveal('#pickOwnPhotos');
            await page.getByRole('button',{name:'Quitar foto de escena 1',exact:true}).click();await page.waitForFunction(()=>!window.facelessMediaBusy);
            await page.reload();await page.waitForFunction(()=>window.facelessStudioReady);await page.evaluate(()=>{activeId='media-fixture';tab='video';route('editor')});
            await page.waitForFunction(()=>facelessProjectPhotos('media-fixture').has(1));
            assert.equal(await page.evaluate(()=>Boolean(audioFile)),false);assert.equal(await page.evaluate(()=>facelessProjectPhotos('media-fixture').has(0)),false);
            assert.equal(await page.evaluate(()=>JSON.stringify(localStorage).includes('fixture-media-passcode-only')),false);assert.deepEqual(errors,[]);
            console.log('PASS: individual photo add/replace/remove, append without loss, reload persistence, removed assets stay deleted, uploaded audio playback, duration fit, speech-matched subtitles, mismatched voice rejection, audio replacement/removal and no stored credentials');
            await page.evaluate(async()=>{
              const p={id:'cinema-fixture',title:'Historia en movimiento',topic:'Movimiento',style:'Romance',duration:3,platform:'TikTok',format:'9:16',scenes:[{time:0,duration:1.5,text:'Una historia viva.',prompt:'One'},{time:1.5,duration:1.5,text:'Un final inolvidable.',prompt:'Two'}]};p.narration=p.scenes.map(s=>s.text).join(' ');projects.unshift(p);activeId=p.id;tab='video';resetMedia();route('editor');
              const source=document.createElement('canvas');source.width=800;source.height=1200;const c=source.getContext('2d');for(let x=0;x<800;x+=40){c.fillStyle=x%80?'#ffcc44':'#5630b2';c.fillRect(x,0,40,1200);}const image=new Image();image.src=source.toDataURL();await image.decode();facelessProjectPhotos(p.id).set(0,image);facelessProjectPhotos(p.id).set(1,image);
              const sample=document.createElement('canvas');sample.width=540;sample.height=960;const sc=sample.getContext('2d');FacelessCinema.background(sc,p,0,.2,image);const first=sample.toDataURL();FacelessCinema.background(sc,p,0,1.1,image);if(first===sample.toDataURL())throw Error('La fotografía se exportaría estática');
            });
            await page.evaluate(bytes=>{audioFile=new File([new Uint8Array(bytes)],'voz-cinema.wav',{type:'audio/wav'});audioFileProjectId='cinema-fixture';updateAudioAttachmentUI();},Array.from(wav(3)));
            await page.locator('#renderVideo').click();
            await page.waitForFunction(()=>!rendering&&document.querySelector('#downloadArea a'),{timeout:25000});
            const cinemaDownload=page.waitForEvent('download');await page.locator('#downloadArea a').click();await (await cinemaDownload).saveAs('/tmp/faceless-cinema.webm');
            assert.deepEqual(errors,[]);
            console.log('PASS: actual canvas photo motion and short video export with narration');
            // Exercise actual TTS decoding/mixing and automatic speech alignment without API credits.
            await page.evaluate(clips=>{
              const p={id:'tts-sync-fixture',title:'Voz sincronizada',style:'Romance',duration:8,format:'9:16',scenes:[{time:0,duration:4,text:'Hola Lola.',prompt:'One'},{time:4,duration:4,text:'Grace vuelve.',prompt:'Two'}]};
              p.narration=p.scenes.map(s=>s.text).join(' ');projects.unshift(p);activeId=p.id;tab='video';resetMedia();route('editor');
              facelessRequestVoice=async text=>({dataURI:'data:audio/wav;base64,'+clips[text.startsWith('Hola')?0:1],provider:'Test fixture'});
              window.facelessRecognizeLocal=async()=>[{word:'Hola',start:.1,end:.4},{word:'Lola',start:.5,end:.9},{word:'Grace',start:1.1,end:1.8},{word:'vuelve',start:2,end:2.8}];
            },[wav(1).toString('base64'),wav(2).toString('base64')]);
            await reveal('#aiVoiceGenerate');
            await page.locator('#aiVoicePasscode').fill('fixture-passcode-for-ui');
            await page.locator('#aiVoiceGenerate').click();
            await page.waitForFunction(()=>current().id==='tts-sync-fixture'&&current().audioAlignment?.method==='speech'&&!facelessVoiceBusy);
            const voiceSync=await page.evaluate(async()=>{
              const p=current(),ctx=new AudioContext();
              try{const decoded=await ctx.decodeAudioData(await audioFile.arrayBuffer());return {duration:p.duration,audioDuration:decoded.duration,cut:p.scenes[1].time,method:p.audioAlignment.method,signature:audioFile.facelessSignature===facelessVoiceSignature(p),saved:Boolean((await facelessMediaGet(p.id+':voice'))?.blob),active:FacelessCinema.captionState(FacelessTiming.cues(p),1.2).words[0].text};}finally{await ctx.close();}
            });
            assert.ok(Math.abs(voiceSync.duration-3)<.02);
            assert.ok(Math.abs(voiceSync.audioDuration-3)<.02);
            assert.equal(voiceSync.cut,1.1);assert.equal(voiceSync.active,'Grace');
            assert.equal(voiceSync.signature,true);assert.equal(voiceSync.saved,true);
            assert.deepEqual(errors,[]);
            console.log('PASS: decoded TTS clips replace fixed slots; automatic word alignment, photo cuts and saved audio share a timeline');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/faceless-cinema.webm > /tmp/cinema-tracks.txt
          grep -q video /tmp/cinema-tracks.txt
          grep -q audio /tmp/cinema-tracks.txt
          echo "PASS: exported video contains video and audio tracks"

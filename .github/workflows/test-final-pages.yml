name: Probar todas las pantallas finales de Faceless
on:
  push:
    branches: ["design/complete-studio-screens-20261112"]
    paths:
      - "index.html"
      - "styles/faceless-pages.css"
      - "scripts/faceless-pages.js"
      - "scripts/editor-layout.js"
      - ".github/workflows/test-final-pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles/faceless-pages.css"
      - "scripts/faceless-pages.js"
      - "scripts/editor-layout.js"
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Servir la web
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          sleep 2
      - name: Probar inicio, crear, búsqueda, proyectos y editor
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},acceptDownloads:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.facelessStudioReady);
            assert.equal(await page.locator('#home .fcx-category').count(),4);
            await page.locator('#home [data-fc-category=farandula]').click();
            assert.equal(await page.locator('#studioGenre').inputValue(),'Farándula');
            assert.equal(await page.locator('#studioMode').inputValue(),'news');
            assert.equal(await page.locator('.fc-discover-kicker').isVisible(),true);
            await page.evaluate(()=>route('create'));
            assert.equal(await page.locator('.fc-creator-banner').isVisible(),true);
            assert.equal(await page.locator('#fcOwnIdea').isVisible(),true);
            assert.equal(await page.locator('.fc-legacy-options').count(),1);
            await page.locator('#fcOwnIdea').fill('Una historia original sobre Lola y su misterio');
            await page.locator('#fcStartAi').click();
            assert.equal(await page.locator('#studioTopic').inputValue(),'Una historia original sobre Lola y su misterio');
            assert.equal(await page.locator('#studioMode').inputValue(),'fiction');
            await page.route('**/faceless-images.marianitord2020.workers.dev/ideas',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({ideas:Array.from({length:10},(_,i)=>({
                id:'fixture-'+i,title:'El misterio de Lola '+i,
                synopsis:'Lola descubre una carta misteriosa en su casa.',
                outline:'Introducción; sorpresa; final',coverPrompt:'Lola fictional dramatic portrait'
              }))})
            }));
            await page.route('**/faceless-images.marianitord2020.workers.dev/images',route=>route.fulfill({status:503,contentType:'application/json',body:'{"error":"Imágenes no disponibles en prueba"}'}));
            await page.route('**/faceless-images.marianitord2020.workers.dev/script',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({title:'El misterio de Lola 1',mode:'ficcion',provider:'Prueba',
                scenes:Array.from({length:8},(_,i)=>({text:'Lola descubrió un misterio en su barrio, escena '+i+'.',prompt:'Escena ficcional'})),sources:[]})
            }));
            await page.locator('#studioVideoOptions').evaluate(el=>el.open=true);
            await page.locator('#studioPass').fill('fixture-project-access-test');
            await page.locator('#studioGenerate').click();
            await page.waitForFunction(()=>document.querySelectorAll('#studioCards .studio-card').length===10);
            await page.locator('#studioCards .studio-card').nth(1).click();
            assert.equal(await page.locator('.fc-hooks .fc-hook-option').count(),4);
            await page.locator('.fc-hooks input[type=radio]').nth(2).check();
            await page.locator('#studioFeature .studio-create').click();
            await page.waitForFunction(()=>current()?.title==='El misterio de Lola 1');
            assert.equal(await page.evaluate(()=>current().selectedHook),await page.evaluate(()=>current().scenes[0].text));
            assert.equal(await page.locator('#editor .fc-steps button').count(),4);
            assert.equal(await page.locator('#editor .fc-steps button').nth(2).textContent().then(s=>s.includes('Subtítulos')),true);
            assert.equal(await page.locator('#editor .fc-editor-stage').isVisible(),true);
            assert.equal(await page.locator('#editor #previewCanvas').isVisible(),true);
            assert.equal(await page.locator('#editor .fc-video-timeline').isVisible(),true);
            await page.locator('.fc-timeline-scene').first().click();
            assert.equal(await page.locator('#sceneForm').isVisible(),true);
            assert.equal(await page.locator('#fcMotionPanel').isVisible(),true);
            await page.evaluate(()=>route('projects'));
            assert.equal(await page.locator('.fc-project-thumb').count(),1);
            assert.equal(await page.locator('.fc-project-state.ready').count(),1);
            assert.equal(await page.locator('#fcProjectStatus').count(),1);
            for(const screen of ['home','create','projects','discover','editor']){
              await page.evaluate(name=>route(name),screen);
              const metrics=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
              assert.ok(metrics.scroll<=metrics.width+2,screen+' has horizontal overflow '+JSON.stringify(metrics));
            }
            assert.deepEqual(errors,[]);
            console.log('PASS: Crear, Explorar, 4 ganchos, reproductor visible, escenas y Mis proyectos');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

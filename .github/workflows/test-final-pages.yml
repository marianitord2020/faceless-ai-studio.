name: Probar las 11 pantallas del boceto final
on:
  pull_request:
    paths:
      - "index.html"
      - "scripts/final-11-pantallas.js"
      - "scripts/final-hero-video.js"
      - "styles/final-11-pantallas.css"
      - "styles/final-hero-video.css"
      - "assets/final/**"
      - ".github/workflows/test-final-pages.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/final-11-pantallas.js"
      - "scripts/final-hero-video.js"
      - "styles/final-11-pantallas.css"
      - "styles/final-hero-video.css"
      - "assets/final/**"
      - ".github/workflows/test-final-pages.yml"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Iniciar sitio de prueba
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/faceless.log" 2>&1 &
          sleep 2
      - name: Probar recorrido Android y editor Hero Video
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},acceptDownloads:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('**/faceless-images.marianitord2020.workers.dev/ideas',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({ideas:Array.from({length:10},(_,i)=>({
                id:'fixture-'+i,title:'La casa embrujada '+i,
                synopsis:'Una familia descubre algo extraño en una casa del pueblo.',
                outline:'Inicio; pistas; revelación',coverPrompt:'Casa misteriosa, fotografia cinematografica'
              }))})
            }));
            await page.route('**/faceless-images.marianitord2020.workers.dev/images',route=>route.fulfill({
              status:503,contentType:'application/json',body:'{"error":"Prueba sin proveedor de imágenes"}'
            }));
            await page.route('**/faceless-images.marianitord2020.workers.dev/script',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({title:'La casa embrujada',mode:'ficcion',provider:'Prueba de interfaz',
                scenes:Array.from({length:8},(_,i)=>({
                  text:'Una historia misteriosa en una casa del pueblo, escena '+i+'.',
                  prompt:'Escena cinematografica de terror '+i
                })),sources:[]})
            }));
            await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.facelessStudioReady);
            assert.equal(await page.locator('#home .final-photo-card').count(),6,'Seis categorias visuales');
            assert.equal(await page.locator('.fc-bottom button').count(),3,'Navegacion inferior');
            await page.locator('#home [data-final-category="Relatos"]').click();
            assert.equal(await page.evaluate(()=>document.body.dataset.screen),'create');
            await page.locator('#finalTopic').fill('');
            assert.equal(await page.locator('#finalGenres .final-photo-card').count(),4,'Cuatro generos');
            await page.locator('#finalGenerate').click();
            assert.equal(await page.evaluate(()=>document.body.dataset.screen),'create','No navegar a formulario duplicado sin permiso');
            assert.equal(await page.locator('#finalAccess').isVisible(),true,'Autorizacion segura y visible en Crear');
            assert.doesNotMatch(await page.locator('#finalNote').textContent(),/5 caracteres|cinco caracteres/i,'No exigir texto cuando el tema esta vacio');
            await page.locator('#finalAccessCode').fill('fixture-private-test-code');
            await page.locator('#finalGenerate').click();
            await page.waitForFunction(()=>document.querySelectorAll('#studioCards .studio-card').length===10,{timeout:12000});
            assert.match(await page.locator('#studioTopic').inputValue(),/Misterios y secretos/i,'El tema vacío usa la categoría Misterio');
            assert.equal(await page.locator('.studio-menu-view').isVisible(),false,'Solo propuestas, no otro formulario');
            assert.equal(await page.locator('.studio-results-view').isVisible(),true);
            assert.equal(await page.evaluate(()=>JSON.stringify(localStorage).includes('fixture-private-test-code')),false);
            assert.equal(await page.locator('#finalResultTitle').textContent(),'10 propuestas para tu video');
            await page.locator('#studioCards .studio-card').first().click();
            await page.waitForFunction(()=>document.querySelector('#discover')?.dataset.finalStage==='ganchos');
            assert.equal(await page.locator('#studioFeature .fc-hook-option').count(),4,'Cuatro ganchos');
            await page.locator('#studioFeature .fc-hook-option input').nth(1).check();
            await page.locator('#studioFeature .studio-create').click();
            assert.equal(await page.locator('.ref-create-view').isVisible(),true,'Estilos visuales y ajustes');
            assert.equal(await page.locator('.final-style-grid .final-photo-card').count(),7,'Fotografias de estilos');
            await page.locator('[data-final-style="anime"]').click();
            await page.locator('#refSetupContinue').click();
            await page.waitForFunction(()=>typeof current==='function'&&current()?.title?.startsWith('La casa embrujada'),{timeout:15000});
            assert.equal(await page.evaluate(()=>current().scenes.length),8);
            assert.equal(await page.evaluate(()=>current().selectedHook),await page.evaluate(()=>current().scenes[0].text));
            await page.evaluate(()=>document.querySelector('#editor .tabs [data-tab="video"]').click());
            await page.waitForSelector('#finalHeroPanel',{state:'attached'});
            assert.equal(await page.locator('#finalHeroFile').count(),1,'Subir Hero Video');
            assert.equal(await page.locator('#finalTransitionPanel [data-final-transition]').count(),6,'Seis transiciones');
            assert.equal(await page.locator('#finalTransitionPanel img').count(),6,'Fotos en GitHub');
            assert.equal(await page.locator('#fcx-visual-toolbar .fcx-style').count(),7,'Siete estilos visibles en editor');
            const sources=await page.evaluate(()=>[...document.querySelectorAll('#fcx-visual-toolbar img, #finalTransitionPanel img')].map(img=>img.src));
            for(const src of sources){const response=await page.request.get(src);assert.equal(response.status(),200,'La imagen del estilo o transición debe existir en GitHub: '+src);}
            await page.evaluate(()=>history.replaceState({},'',new URL('crear-con-ia/',location.origin+'/').pathname));
            await page.locator('#fcx-visual-toolbar button').first().click();
            assert.ok(await page.locator('#fcx-visual-toolbar .fcx-style').count()>=7);
            assert.equal(await page.locator('.fc-timeline-hero-jump').count(),1,'Acceso al Hero Video desde timeline');
            assert.equal(await page.locator('#editor #previewCanvas').count(),1,'Reproductor');
            await page.locator('#finalTransitionPanel [data-final-transition="slide"]').click();
            assert.equal(await page.evaluate(()=>current().transitionType),'slide');
            await page.evaluate(()=>route('projects'));
            assert.equal(await page.locator('#projectsList .project').count(),1);
            for(const screen of ['home','create','projects','discover','editor']){
              await page.evaluate(name=>route(name),screen);
              const metrics=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
              assert.ok(metrics.scroll<=metrics.width+2,screen+' desborda horizontalmente: '+JSON.stringify(metrics));
            }
            assert.deepEqual(errors,[],'Sin errores de ejecucion');
            console.log('PASS: seis categorias, diez propuestas, cuatro ganchos, siete estilos, Hero Video y transiciones');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

      - name: Probar la sesión D1 y los servicios sin pasar APP_PASSCODE al navegador
        run: node tests/d1-gateway-ui.cjs


name: Probar dashboard del boceto final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/final-11-pantallas.js"
      - "styles/final-11-pantallas.css"
      - ".github/workflows/test-dashboard.yml"
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dashboard.log 2>&1 &
          sleep 2
      - name: Revisar Inicio, Crear y categorías
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const size of [{width:1440,height:900},{width:390,height:844}]){
              const page=await browser.newPage({viewport:size});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4173/');
              await page.waitForFunction(()=>window.facelessStudioReady);
              assert.equal(await page.locator('#home .final-photo-card').count(),6);
              assert.equal(await page.locator('.fc-bottom button').count(),3);
              await page.locator('#home [data-final-category="Relatos"]').click();
              assert.equal(await page.evaluate(()=>document.body.dataset.screen),'create');
              assert.equal(await page.locator('#finalGenres .final-photo-card').count(),4);
              assert.equal(await page.locator('#finalTopic').getAttribute('placeholder'),'¿Qué quieres contar?');
              await page.locator('[data-final-mode="news"]').click();
              assert.equal(await page.locator('#finalTopic').getAttribute('placeholder'),'¿Qué tema actual te interesa?');
              await page.locator('[data-final-mode="factual"]').click();
              assert.equal(await page.locator('#finalTopic').getAttribute('placeholder'),'¿Qué quieres aprender?');
              assert.equal(await page.locator('#studioImageStyle option').count(),7);
              assert.equal(await page.locator('#studioVoice option').count(),9);
              const metrics=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
              assert.ok(metrics.scroll<=metrics.width+3,'El dashboard desborda: '+JSON.stringify(metrics));
              assert.deepEqual(errors,[]);
              console.log('Dashboard aprobado',size.width);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

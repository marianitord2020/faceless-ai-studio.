name: Auditoría visual móvil Faceless
on:
  push:
    branches: ["design/visual-polish-mobile-20261112"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/faceless-visual-http.log 2>&1 &
          sleep 2
      - run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            fs.mkdirSync('visual-audit',{recursive:true});
            for(const width of [360,390,412,768]){
              const page=await browser.newPage({viewport:{width,height:844},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4173/');
              await page.waitForFunction(()=>window.facelessStudioReady);
              await page.evaluate(()=>{
                const fixture=[0,1,2].map((i)=>({
                  id:'audit'+i,title:i===0?'La noticia más comentada de República Dominicana':'Un misterio que cambió la vida de una familia',
                  topic:'Historia sobre una investigación en Higüey',style:'Misterio',format:'9:16',
                  platform:'TikTok',duration:60,date:new Date().toISOString(),
                  scenes:Array.from({length:6},(_,j)=>({time:j*10,duration:10,text:'Lola descubrió un misterio en Higüey y buscó la verdad.',prompt:'Cinematic night street.'}))
                }));
                projects.unshift(...fixture);activeId=fixture[0].id;tab='summary';
              });
              const list=[
                ['home',()=>page.evaluate(()=>route('home'))],
                ['create',()=>page.evaluate(()=>route('create'))],
                ['discover',()=>page.evaluate(()=>route('discover'))],
                ['projects',()=>page.evaluate(()=>route('projects'))],
                ['editor-summary',()=>page.evaluate(()=>{tab='summary';route('editor')})],
                ['editor-scenes',()=>page.evaluate(()=>{tab='scenes';route('editor')})],
                ['editor-video',()=>page.evaluate(()=>{tab='video';route('editor')})]
              ];
              for(const [name,action] of list){
                await action();await page.waitForTimeout(150);
                const metrics=await page.evaluate(()=>{
                  const present=(el)=>{const style=getComputedStyle(el),r=el.getBoundingClientRect();return style.visibility!=='hidden'&&style.display!=='none'&&r.width>2&&r.height>2&&r.bottom>0&&r.top<innerHeight};
                  const els=[...document.querySelectorAll('button,input,textarea,select,canvas,h1,h2,h3,.fc-bottom,.editor-export-bar')].filter(present);
                  const odd=els.filter(e=>{const r=e.getBoundingClientRect();return r.left< -2||r.right>innerWidth+2}).map(e=>({id:e.id,tag:e.tagName,cls:String(e.className).slice(0,35),text:(e.textContent||'').trim().slice(0,35),bounds:[...['left','right'].map(k=>Math.round(e.getBoundingClientRect()[k]))]})).slice(0,20);
                  const clipped=els.filter(el=>{const s=getComputedStyle(el);return s.overflowX==='hidden'&&el.scrollWidth>el.clientWidth+6}).map(e=>({id:e.id,tag:e.tagName,cls:String(e.className).slice(0,35)})).slice(0,15);
                  const nav=document.querySelector('.fc-bottom'),bar=document.querySelector('.editor-export-bar');
                  return {sw:document.documentElement.scrollWidth,iw:innerWidth,body:document.body.dataset.screen,odd,clipped,nav:nav?getComputedStyle(nav).display:'none',bar:bar?getComputedStyle(bar).display:'none'};
                });
                console.log('VISUAL_AUDIT',JSON.stringify({width,name,...metrics,errors}));
                await page.screenshot({path:'visual-audit/'+width+'-'+name+'.png',fullPage:true});
              }
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faceless-mobile-screens
          path: visual-audit/*.png
          retention-days: 3

name: Corregir Hero Video y diseño del editor Android
on:
  pull_request:
    paths:
      - "scripts/final-hero-video.js"
      - "scripts/faceless-pages.js"
      - "scripts/editor-layout.js"
      - "styles/final-hero-video.css"
      - "index.html"
      - "tests/hero-mobile-editor.cjs"
      - ".github/workflows/test-hero-mobile.yml"
  push:
    branches: [main]
    paths:
      - "scripts/final-hero-video.js"
      - "scripts/faceless-pages.js"
      - "scripts/editor-layout.js"
      - "styles/final-hero-video.css"
      - "index.html"
      - "tests/hero-mobile-editor.cjs"
      - ".github/workflows/test-hero-mobile.yml"
permissions:
  contents: read
jobs:
  android-hero:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Instalar ffmpeg para generar el clip de prueba
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Crear un Hero Video VP8 de seis segundos para prueba
        run: |
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0x593281:s=160x288:r=10' \
            -t 6.2 -c:v libvpx -b:v 140k -an tests/hero-mobile-fixture.webm
          test -s tests/hero-mobile-fixture.webm
      - name: Iniciar página de pruebas
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hero-mobile-http.log 2>&1 &
          sleep 2
      - name: Probar clip real, poster y controles sin solapamientos
        run: node tests/hero-mobile-editor.cjs

name: Verificar boceto final Android de Faceless
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/final-11-pantallas.js"
      - "scripts/final-hero-video.js"
      - "styles/final-11-pantallas.css"
      - ".github/workflows/test-boceto-pantallas.yml"
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Abrir aplicación
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/faceless-web.log 2>&1 &
          sleep 2
      - name: Capturas y navegación Android actual
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),fs=require('node:fs');
          (async()=>{
            fs.mkdirSync('boceto-android',{recursive:true});
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            for(const width of [360,390,412]){
              const page=await browser.newPage({viewport:{width,height:844},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',error=>errors.push(error.message));
              await page.goto('http://127.0.0.1:4173/');
              await page.waitForFunction(()=>window.facelessStudioReady);
              assert.equal(await page.locator('#home .final-home-hero').count(),1);
              assert.equal(await page.locator('#home [data-final-category]').count(),6);
              await page.screenshot({path:'boceto-android/'+width+'-inicio.png',fullPage:true});
              await page.locator('#home [data-final-new]').first().click();
              assert.equal(await page.locator('.final-create').isVisible(),true);
              assert.equal(await page.locator('#finalGenres .final-photo-card').count(),4);
              await page.screenshot({path:'boceto-android/'+width+'-crear.png',fullPage:true});
              await page.locator('[data-final-mode="news"]').click();
              assert.equal(await page.locator('#finalGenres .final-photo-card').count(),4);
              await page.locator('#finalTopic').fill('Noticias de Higüey hoy');
              await page.screenshot({path:'boceto-android/'+width+'-actualidad.png',fullPage:true});
              await page.evaluate(()=>{
                const p={id:'boceto-android-'+innerWidth,title:'Historia de muestra',topic:'Relato ficticio',
                  style:'Misterio',platform:'TikTok',duration:60,format:'9:16',
                  date:new Date().toISOString(),scenes:Array.from({length:8},(_,i)=>({
                    time:i*7.5,duration:7.5,text:'Escena ficticia '+(i+1),prompt:'Ilustración '+(i+1)
                  }))};
                p.hook=p.scenes[0].text;p.narration=p.scenes.map(s=>s.text).join('\n');
                projects.unshift(p);activeId=p.id;tab='video';route('editor');
              });
              await page.waitForSelector('#finalHeroPanel',{state:'attached'});
              assert.equal(await page.locator('.boceto-hero-card').isVisible(),true,'El Hero compacto es visible en Escenas');
              assert.equal(await page.locator('#finalHeroPanel').isVisible(),false,'Los ajustes Hero empiezan cerrados');
              await page.locator('.boceto-hero-detail > summary').click();
              assert.equal(await page.locator('#finalHeroPanel').isVisible(),true,'El Hero se puede ajustar cuando se solicita');
              assert.equal(await page.locator('#finalHeroFile').count(),1);
              await page.locator('#bocetoEditorNav [data-boceto-tab="video"]').click();
              assert.equal(await page.locator('.boceto-ai-card #productionStart').isVisible(),true);
              await page.locator('.boceto-ai-more > summary').click();
              assert.equal(await page.locator('#finalTransitionPanel [data-final-transition]').count(),6);
              await page.screenshot({path:'boceto-android/'+width+'-editor.png',fullPage:true});
              await page.evaluate(()=>route('projects'));
              assert.equal(await page.locator('#projectsList .project').count(),1);
              await page.screenshot({path:'boceto-android/'+width+'-proyectos.png',fullPage:true});
              const info=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
              assert.ok(info.scroll<=info.width+3,'Desbordamiento horizontal: '+JSON.stringify(info));
              assert.deepEqual(errors,[],'Errores JavaScript');
              console.log('PASS',width,info);
              await page.close();
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boceto-android
          path: boceto-android
          if-no-files-found: ignore

name: Verificar pantallas interiores contra boceto
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/boceto-pantallas.js"
      - "styles/boceto-pantallas.css"
      - "index.html"
      - ".github/workflows/test-boceto-pantallas.yml"
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Abrir app local
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/faceless-web.log 2>&1 &
          sleep 2
      - name: Revisar navegacion y pantallas Android sin cambiar Inicio
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),fs=require('fs');
          (async()=>{
           fs.mkdirSync('boceto-android',{recursive:true});
           const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
           for(const width of [360,390,412]){
            const page=await browser.newPage({viewport:{width,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',err=>errors.push(err.message));
            await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.facelessStudioReady);
            assert.equal(await page.locator('#home .fcx-hero').count(),1,'Inicio original sigue intacto');
            await page.screenshot({path:'boceto-android/'+width+'-inicio.png',fullPage:true});
            await page.evaluate(()=>route('create'));
            assert.equal(await page.locator('.boceto-create').isVisible(),true);
            assert.equal(await page.locator('.fc-creator-banner').isVisible(),false);
            assert.equal(await page.locator('#bocetoCreateCover').isVisible(),true);
            await page.screenshot({path:'boceto-android/'+width+'-crear.png',fullPage:true});
            await page.locator('#bocetoCreateTopic').fill('Noticias de Higüey hoy');
            await page.locator('#bocetoCreateGo').click();
            assert.equal(await page.locator('#studioMode').inputValue(),'news');
            assert.equal(await page.locator('#studioTopic').inputValue(),'Noticias de Higüey hoy');
            assert.equal(await page.locator('.boceto-news-top').isVisible(),true);
            assert.equal(await page.locator('#studioVideoOptions').isVisible(),true,'Codigo privado accesible');
            await page.screenshot({path:'boceto-android/'+width+'-noticias.png',fullPage:true});
            await page.evaluate(()=>{
              const p={id:'boceto-sample',title:'Una noticia de ejemplo (solo prueba visual)',topic:'Prueba visual',style:'Noticias',platform:'TikTok',duration:60,format:'9:16',date:new Date().toISOString(),scenes:[]};
              for(let i=0;i<8;i++)p.scenes.push({time:i*7.5,duration:7.5,text:'Escena de ejemplo '+(i+1),prompt:'Foto escena '+(i+1)});
              p.hook=p.scenes[0].text;p.narration=p.scenes.map(s=>s.text).join('\n');projects.unshift(p);activeId=p.id;tab='narration';route('editor');
            });
            await page.waitForFunction(()=>document.querySelector('.boceto-hook-panel'));
            assert.equal(await page.locator('.boceto-hook-option').count(),4);
            await page.screenshot({path:'boceto-android/'+width+'-guion.png',fullPage:true});
            await page.locator('.boceto-hook-option').nth(1).click();
            await page.locator('.boceto-use-hook').click();
            assert.equal(await page.evaluate(()=>current().selectedHook?.startsWith('¿Qué se sabe realmente')),true);
            await page.locator('.boceto-tabs [data-ref-tab="scenes"]').click();
            await page.waitForFunction(()=>document.querySelector('.ref-scene-editor'));
            await page.screenshot({path:'boceto-android/'+width+'-editor.png',fullPage:true});
            await page.evaluate(()=>route('projects'));
            await page.waitForFunction(()=>document.querySelector('.boceto-project-status'));
            await page.screenshot({path:'boceto-android/'+width+'-proyectos.png',fullPage:true});
            assert.equal(await page.locator('.fcx-project-tabs button').count(),3);
            const info=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
            assert.ok(info.scroll<=info.width+3,'Desbordamiento horizontal '+JSON.stringify(info));
            assert.deepEqual(errors,[],'No errores JavaScript');
            console.log('PASS Android boceto',width,info);
            await page.close();
           }
           await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Guardar capturas de las pantallas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boceto-android
          path: boceto-android
          if-no-files-found: ignore

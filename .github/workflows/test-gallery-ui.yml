name: Probar galería visual y generación del boceto final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/final-11-pantallas.js"
      - "styles/final-11-pantallas.css"
      - "assets/mockup/**"
      - ".github/workflows/test-gallery-ui.yml"
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gallery.log 2>&1 &
          sleep 2
      - name: Comprobar galería y recursos del repositorio
        run: |
          node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/');
            await page.waitForFunction(()=>window.facelessStudioReady);
            await page.locator('#home [data-final-new]').first().click();
            assert.equal(await page.locator('#studioVideoOptions').count(),1);
            assert.equal(await page.locator('#finalTopic').isVisible(),true);
            const labels={
              fiction:['Romance','Misterio','Terror','Fantasía'],
              factual:['Historia','Curiosidades','Motivación','Educativo'],
              news:['Noticias','Farándula','Entretenimiento','Deportes']
            };
            for(const [width,height] of [[360,740],[390,844],[412,915],[768,1024]]){
              await page.setViewportSize({width,height});
              for(const [mode,names] of Object.entries(labels)){
                await page.locator('[data-final-mode="'+mode+'"]').click();
                assert.deepEqual(await page.locator('#finalGenres .final-photo-card span').allTextContents(),names);
                const cards=await page.locator('#finalGenres .final-photo-card').evaluateAll(els=>els.map(x=>{
                  const r=x.getBoundingClientRect();return {top:r.top,left:r.left,width:r.width};
                }));
                assert.equal(cards.length,4);
                assert.ok(Math.abs(cards[0].top-cards[1].top)<2&&cards[2].top>cards[0].top&&Math.abs(cards[2].top-cards[3].top)<2,'Tarjetas deben estar en 2x2');
                const bounds=await page.evaluate(()=>({width:innerWidth,scroll:document.documentElement.scrollWidth}));
                assert.ok(bounds.scroll<=bounds.width+3,'Desborde del generador');
              }
            }
            const images=await page.locator('#home .final-photo-card img, #finalGenres .final-photo-card img').evaluateAll(els=>[...new Set(els.map(i=>i.getAttribute('src')))]);
            for(const src of images){
              assert.ok(src.startsWith('assets/'),'No usar URLs temporales para fotos de interfaz: '+src);
              const response=await page.request.get('http://127.0.0.1:4173/'+src);
              assert.equal(response.status(),200,'Imagen alojada en repositorio: '+src);
            }
            assert.deepEqual(errors,[]);
            console.log('PASS galería final y fotos locales');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

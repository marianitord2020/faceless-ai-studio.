name: Diagnostico seguro del acceso Cloudflare y D1
on:
  pull_request:
    paths:
      - ".github/workflows/inspect-access-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Estado HTTP sin mostrar contenidos o credenciales
        shell: bash
        run: |
          HOST='https://faceless-access-prueba.marianitord2020.workers.dev'
          for route in / /auth/session /login /health; do
            result=$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "$HOST$route" || true)
            echo "Access Worker endpoint $route returned HTTP $result"
          done
      - name: Consultar metadatos de Worker y enlaces D1 (solo lectura)
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare GitHub Actions credentials unavailable"
            exit 0
          fi
          HOST="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --silent --max-time 20 --output /tmp/worker-settings.json \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$HOST/workers/scripts/faceless-access-prueba/settings" || true
          curl --silent --max-time 20 --output /tmp/d1-metadata.json \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$HOST/d1/database?per_page=100" || true
          node <<'NODE'
          const fs=require('node:fs');
          const read=f=>{try{return JSON.parse(fs.readFileSync(f,'utf8'))}catch{return {}}};
          const w=read('/tmp/worker-settings.json');
          const bindings=Array.isArray(w.result?.bindings)?w.result.bindings:[];
          const d=read('/tmp/d1-metadata.json');
          const databases=Array.isArray(d.result)?d.result:[];
          console.log('Access Worker settings accessible:',w.success===true);
          console.log('D1 binding names:',JSON.stringify(bindings.filter(b=>b.type==='d1').map(b=>b.name)));
          console.log('Cloudflare D1 database list accessible:',d.success===true);
          console.log('D1 database names:',JSON.stringify(databases.map(b=>b.name).filter(Boolean).slice(0,35)));
          NODE

      - name: Identificar rutas y mecanismo de inicio de sesion sin revelar el codigo
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          HOST="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          code=$(curl --silent --max-time 20 --output /tmp/access-source.raw \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$HOST/workers/scripts/faceless-access-prueba") || code=network_error
          echo "Access Worker source retrieval HTTP $code"
          if [ "$code" != 200 ]; then exit 0; fi
          node <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('/tmp/access-source.raw','utf8');
          const routes=[...new Set([...source.matchAll(/['"](\/(?:login|logout|auth|callback|session|api|verify|health|github|register|signin|signup)[-a-zA-Z0-9_\/]*)(?:\?[^'"]*)?['"]/g)].map(x=>x[1]))];
          const flags=['github.com/login/oauth','github','client_id','client_secret','set-cookie','samesite','httponly','session','sqlite','DB.prepare','redirect_uri','github_callback','cors'].filter(x=>source.toLowerCase().includes(x.toLowerCase()));
          console.log('Possible access routes:',JSON.stringify(routes.slice(0,35)));
          console.log('Features present:',JSON.stringify(flags));
          const paths=[...new Set([...source.matchAll(/\/(?:api|auth|login|register|logout|callback|verify|session)\/?[a-zA-Z0-9_-]*/g)].map(x=>x[0]))];
          const sqlTables=[...new Set([...source.matchAll(/(?:FROM|INTO|UPDATE|TABLE(?:\s+IF\s+NOT\s+EXISTS)?)\s+["'\`]?([a-z_]{2,30})\b/gi)].map(x=>x[1].toLowerCase()))].filter(x=>!['if','not','exists'].includes(x));
          const methods=[...new Set([...source.matchAll(/(?:GET|POST|PUT|PATCH|DELETE)\b/g)].map(x=>x[0]))];
          const redirectToGithub=source.includes('marianitord2020.github.io');
          const cookieFlags=['Strict','Lax','None','Secure','HttpOnly'].filter(x=>source.includes(x));
          console.log('Access URL patterns:',JSON.stringify(paths.slice(0,30)));
          console.log('SQL table names:',JSON.stringify(sqlTables.slice(0,25)));
          console.log('HTTP methods mentioned:',JSON.stringify(methods));
          console.log('Has existing GitHub Pages redirect:',redirectToGithub);
          console.log('Cookie security flags present:',JSON.stringify(cookieFlags));
          console.log('Existing Worker references Faceless media API:',source.includes('faceless-images.marianitord2020.workers.dev'));
          console.log('Existing Worker references APP_PASSCODE:',source.includes('APP_PASSCODE'));
          console.log('Existing Worker references x-app-token:',source.toLowerCase().includes('x-app-token'));
          console.log('Existing Worker references frontend Github Pages:',source.includes('marianitord2020.github.io'));
          console.log('Existing Worker calls upstream fetch:',/fetch\s*\(/.test(source));
          console.log('Existing Worker checks session cookies:',/cookie|session_id|session_token/i.test(source));
          console.log('Existing Worker has API prefix routing:',source.includes('/api/'));
          // Confirm whether login serves the GitHub Pages frontend or redirects away from it.
          const gitpos=source.indexOf('marianitord2020.github.io');
          const githubContext=gitpos<0?'':source.slice(Math.max(0,gitpos-280),gitpos+150);
          const proxyLikely=/fetch\s*\(/.test(githubContext);
          const redirectLikely=/redirect\s*\(/i.test(githubContext);
          const proxyApi=source.includes('x-app-token')&&source.includes('APP_PASSCODE')&&source.includes('/api/');
          console.log('Frontend fetch/proxy near Github Pages:',proxyLikely);
          console.log('Frontend redirect near Github Pages:',redirectLikely);
          console.log('API gateway with server-side APP_PASSCODE likely:',proxyApi);
          console.log('Access Worker uses Access-Control-Allow-Origin:',/Access-Control-Allow-Origin|access-control-allow-origin/i.test(source));



          NODE

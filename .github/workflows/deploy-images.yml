name: Publicar fotos IA en Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-images.yml'

permissions:
  contents: read

concurrency:
  group: faceless-images-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar faceless-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
      GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY }}
    steps:
      - name: Verificar las credenciales de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$APP_PASSCODE" ] || [ "${#APP_PASSCODE}" -lt 16 ]; then
            echo "::error::Falta APP_PASSCODE (mínimo 16 caracteres) en los secretos de GitHub Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Verificar ruta de voz y alineación antes de publicar
        run: |
          node tests/media-timing.mjs
          node tests/transcribe-route.mjs
      - name: Publicar código, variables públicas y binding AI
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy
      - name: Guardar APP_PASSCODE privado en el Worker sin exponerlo
        working-directory: workers
        run: |
          printf '%s' "$APP_PASSCODE" | npx --yes wrangler@4 secret put APP_PASSCODE --config wrangler.toml

      - name: Configurar API gratuita de Google Gemini TTS cuando exista la clave
        working-directory: workers
        run: |
          if [ -n "$GEMINI_TTS_API_KEY" ]; then
            printf '%s' "$GEMINI_TTS_API_KEY" | npx --yes wrangler@4 secret put GEMINI_TTS_API_KEY --config wrangler.toml
            echo "Gemini TTS habilitado sin exponer la clave."
          else
            echo "Sin GEMINI_TTS_API_KEY: se utiliza voz Cloudflare Aura-2-es."
          fi

      - name: Comprobar que el servidor exige un código privado
        run: |
          set -euo pipefail
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST 'https://faceless-images.marianitord2020.workers.dev/images' \
              --header 'Origin: https://marianitord2020.github.io' \
              --header 'Content-Type: application/json' \
              --header 'x-app-token: prueba-no-autorizada' \
              --data '{"prompt":"fotografía cinematográfica de prueba de una montaña al atardecer"}') || status="error-de-red"
            if [ "$status" = "401" ]; then
              echo "Worker publicado y protegido por APP_PASSCODE."
              exit 0
            fi
            sleep 3
          done
          if [ "$status" = "503" ]; then
            echo "::error::Worker publicado, pero falta APP_PASSCODE como Secret de Cloudflare."
          else
            echo "::error::La protección del Worker no respondió como se esperaba (HTTP $status)."
          fi
          exit 1

      - name: Comprobar reconocimiento real de voz en español
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          espeak-ng -v es -s 145 -w /tmp/studio-voz-es.wav 'Hola, esta es una prueba de sincronización. Lola encontró una carta en el jardín.'
          python3 <<'PY'
          import array,io,json,os,subprocess,sys,wave
          with wave.open('/tmp/studio-voz-es.wav','rb') as original:
              assert original.getnchannels()==1 and original.getsampwidth()==2
              samples=array.array('h',original.readframes(original.getnframes()));rate=original.getframerate()
          converted=array.array('h')
          for i in range(int(len(samples)*16000/rate)):
              position=i*rate/16000;left=int(position);right=min(left+1,len(samples)-1);fraction=position-left
              converted.append(round(samples[left]*(1-fraction)+samples[right]*fraction))
          output=io.BytesIO()
          with wave.open(output,'wb') as wav:
              wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(16000);wav.writeframes(converted.tobytes())
          call=subprocess.run(['curl','--silent','--show-error','--max-time','110','-X','POST','https://faceless-images.marianitord2020.workers.dev/transcribe','-H','Origin: https://marianitord2020.github.io','-H','x-app-token: '+os.environ['APP_PASSCODE'],'-H','Content-Type: audio/wav','--data-binary','@-','-w','\n%{http_code}'],input=output.getvalue(),capture_output=True,check=True)
          body,status=call.stdout.rsplit(bytes([10]),1)
          data=json.loads(body)
          if status!=b'200':
              message=str(data.get('error',''))
              if status==b'503' and ('cuota diaria gratuita' in message or 'daily free allocation' in message):
                  print('::warning::RECONOCIMIENTO REAL PENDIENTE: la cuota gratuita diaria está agotada. No se ha validado la transcripción real; no se activaron servicios de pago.')
                  sys.exit(0)
              raise RuntimeError('Reconocimiento: HTTP '+status.decode()+' '+message[:180])
          words=data.get('words',[])
          assert len(words)>=8,'No se recuperaron suficientes palabras'
          assert all(w['end']>w['start']>=0 for w in words),'Tiempos no válidos'
          text=' '.join(w['word'] for w in words).lower()
          assert 'carta' in text and 'jard' in text,'No coincide la voz española reconocida'
          print('RECONOCIMIENTO REAL: voz española, '+str(len(words))+' palabras con tiempos; ruta protegida y audio WAV verificados.')
          PY

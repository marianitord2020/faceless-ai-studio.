name: Publicar fotos IA en Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-images.yml'

permissions:
  contents: read

concurrency:
  group: faceless-images-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar faceless-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verificar las credenciales de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Publicar código, variables públicas y binding AI
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy

# Run node build-assets.mjs before deploying this Worker.
name = "faceless-access-prueba"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./.assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "faceless-cuentas"
database_id = "c435ed15-d13f-4066-b2a7-11d815fb060f"

[[services]]
binding = "MEDIA"
service = "faceless-images"

[triggers]
crons = ["17 4 * * *"]

name = "faceless-images"
main = "ai-images-worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://marianitord2020.github.io"
ENABLE_PAID_IMAGES = "false"
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"

# Strict daily/free mode: no trial-credit or HF billed inference calls.
FREE_DAILY_ONLY = "true"
ENABLE_HF_INFERENCE = "false"
ENABLE_DEEPGRAM_TRIAL = "false"

ENABLE_AI_HORDE = "true"
ENABLE_IMAGEROUTER = "false" # API requires a one-time deposit; disabled under no-payment policy.
IMAGEROUTER_MODEL = "Tongyi-MAI/Z-Image-Turbo:free"
